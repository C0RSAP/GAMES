<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Аркада — 8 игр на одном экране</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div id="app">
  <!-- МЕНЮ -->
  <section id="menu" class="screen active">
    <header class="hero">
      <h1 class="title">АРКАДА</h1>
      <p class="subtitle">8 игр на одном компьютере · для 1–4 игроков</p>
      <div class="status-chips">
        <span class="chip chip-green" id="sound-chip">🔊 Звук: вкл</span>
        <span class="chip chip-gold">⌨️ F11 — полный экран</span>
      </div>
    </header>
    <div class="games-grid" id="games-grid"></div>
    <footer class="hint-bar">
      <span><kbd>1</kbd>–<kbd>8</kbd> выбрать</span>
      <span><kbd>Enter</kbd> играть</span>
      <span><kbd>M</kbd> звук</span>
      <span><kbd>ESC</kbd> назад</span>
    </footer>
  </section>

  <!-- ИГРА -->
  <section id="game-screen" class="screen">
    <header class="game-header">
      <button class="back-btn" id="back-btn">← В меню</button>
      <h2 id="game-title">Игра</h2>
      <div class="game-hud" id="game-hud"></div>
    </header>
    <div class="game-area">
      <canvas id="game-canvas" width="960" height="640"></canvas>
      <div id="dom-game" class="dom-game"></div>
      <div id="overlay" class="overlay hidden"></div>
    </div>
  </section>
</div>

<script src="words.js"></script>
<script src="arcade.js"></script>
</body>
</html>
