<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Аркада на одном компьютере</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- ===== МЕНЮ ===== -->
    <section id="menu" class="screen active">
      <div class="stars"></div>
      <header class="hero">
        <h1 class="logo">АРКАДА</h1>
        <p class="tagline">на одном компьютере · 8 игр · играй вместе</p>
      </header>
      <div class="games-grid" id="games-grid"></div>
      <footer class="footer">
        <span>Открывай с телефона или компа · играй вместе</span>
      </footer>
    </section>

    <!-- ===== ИГРОВОЙ ЭКРАН (контейнер) ===== -->
    <section id="game-screen" class="screen">
      <button id="btn-back" class="btn-back" title="В меню">←</button>
      <div id="game-root"></div>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
